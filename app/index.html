<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilans ECTS: karta przedmiotu</title>
  <style>
    :root { --granat: #13294B; --tlo: #F7F9FA; --linia: #E3E7EC; --tekst: #1B2430; --szary: #5A6673;
            --ok: #1E7A46; --ok-tlo: #E6F4EC; --blad: #B3261E; --blad-tlo: #FBEAE8; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: var(--tekst); background: var(--tlo); }
    header { background: var(--granat); color: #fff; padding: 20px 32px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: #A8B7C9; font-size: 14px; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .karta { background: #fff; border: 1px solid var(--linia); border-radius: 6px; padding: 20px 24px; margin-bottom: 16px; }
    label { font-weight: 600; margin-right: 8px; }
    select { font-size: 15px; padding: 6px 8px; min-width: 320px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--linia); font-size: 15px; }
    th { color: var(--szary); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    td.liczba, th.liczba { text-align: right; }
    .podsumowanie { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .kafel { background: var(--tlo); border-radius: 6px; padding: 12px 14px; }
    .kafel .etykieta { font-size: 12px; color: var(--szary); text-transform: uppercase; letter-spacing: .04em; }
    .kafel .wartosc { font-size: 22px; font-weight: 700; margin-top: 4px; word-break: break-all; }
    .status { padding: 12px 16px; border-radius: 6px; font-weight: 600; margin-top: 12px; }
    .status.ok { background: var(--ok-tlo); color: var(--ok); }
    .status.blad { background: var(--blad-tlo); color: var(--blad); }
    footer { text-align: center; color: var(--szary); font-size: 12px; margin: 24px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Bilans nakładu pracy studenta</h1>
    <p>Pomocnik do kart przedmiotów: godziny, punkty ECTS, kontrola zgodności</p>
  </header>

  <main>
    <section class="karta">
      <label for="wybor">Przedmiot:</label>
      <select id="wybor"></select>
    </section>

    <section class="karta">
      <h2 id="tytul" style="margin-top:0"></h2>
      <table>
        <thead>
          <tr><th>Forma aktywności</th><th>Kategoria</th><th class="liczba">Godziny</th></tr>
        </thead>
        <tbody id="wiersze"></tbody>
      </table>
    </section>

    <section class="karta">
      <div class="podsumowanie">
        <div class="kafel"><div class="etykieta">Zajęcia kontaktowe</div><div class="wartosc" id="kontaktowe"></div></div>
        <div class="kafel"><div class="etykieta">Praca własna</div><div class="wartosc" id="wlasne"></div></div>
        <div class="kafel"><div class="etykieta">Razem godzin</div><div class="wartosc" id="suma"></div></div>
        <div class="kafel"><div class="etykieta">ECTS (deklarowane)</div><div class="wartosc" id="ects"></div></div>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <footer>Ćwiczenie „bilans-ects” · Od promptu do produktu · Sesja 4</footer>

  <script src="dane.js"></script>
  <script src="ects.js"></script>
  <script>
    const NAZWY_KATEGORII = { kontaktowe: "z prowadzącym", wlasna: "praca własna" };
    const wybor = document.getElementById("wybor");

    PRZEDMIOTY.forEach((p, i) => {
      const opcja = document.createElement("option");
      opcja.value = i;
      opcja.textContent = p.nazwa + " (" + p.ects + " ECTS)";
      wybor.appendChild(opcja);
    });

    function pokaz(indeks) {
      const p = PRZEDMIOTY[indeks];
      document.getElementById("tytul").textContent = p.nazwa + " · " + p.kod;

      const tbody = document.getElementById("wiersze");
      tbody.innerHTML = "";
      p.aktywnosci.forEach((a) => {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td>" + a.forma + "</td><td>" + NAZWY_KATEGORII[a.kategoria] +
          "</td><td class='liczba'>" + ECTS.formatujGodziny(a.godziny) + "</td>";
        tbody.appendChild(tr);
      });

      document.getElementById("kontaktowe").textContent = ECTS.formatujGodziny(ECTS.godzinyKontaktowe(p.aktywnosci)) + " h";
      document.getElementById("wlasne").textContent = ECTS.formatujGodziny(ECTS.godzinyWlasne(p.aktywnosci)) + " h";
      document.getElementById("suma").textContent = ECTS.formatujGodziny(ECTS.sumaGodzin(p.aktywnosci)) + " h";
      document.getElementById("ects").textContent = p.ects;

      const wynik = ECTS.sprawdzBilans(p);
      const status = document.getElementById("status");
      status.className = "status " + wynik.status;
      status.textContent = wynik.komunikat;
    }

    wybor.addEventListener("change", () => pokaz(wybor.value));
    pokaz(0);
  </script>
</body>
</html>
